name: Nix

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-flake:
    name: Flake check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate flake structure
        run: nix flake check --no-build

      - name: Verify dev shell provides Rust toolchain
        run: nix develop --command cargo --version

  build:
    name: nix build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (CPU-only): merge gate — must pass.
          - os: ubuntu-latest
            continue-on-error: false
          # macOS (Metal via embed-library): non-blocking signal.
          # A slow/heavy sandbox compile; failure here doesn't gate the merge.
          - os: macos-latest
            continue-on-error: true

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build qmd package
        continue-on-error: ${{ matrix.continue-on-error }}
        run: nix build .#default -L

      - name: Smoke-test the result binary
        if: success()
        continue-on-error: ${{ matrix.continue-on-error }}
        run: ./result/bin/qmd --version
